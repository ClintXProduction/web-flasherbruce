<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">CLTX4 Neon RGB Creator Dashboard</title>
<desc id="desc">Combined TikTok and GitHub dashboard. TikTok followers are user-provided as 2,600 plus. Trend and pie-chart data are clearly labeled illustrative. GitHub metrics are not supplied.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070912"/><stop offset=".55" stop-color="#101025"/><stop offset="1" stop-color="#07080f"/></linearGradient>
  <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5ff"/><stop offset=".48" stop-color="#a855f7"/><stop offset="1" stop-color="#ff2d95"/></linearGradient>
  <linearGradient id="pinkArea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff2d95" stop-opacity=".4"/><stop offset="1" stop-color="#ff2d95" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#8b5cf6" stroke-opacity=".08"/></pattern>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#9ca3bd}.white{fill:#f7f7ff}.cyan{fill:#00f5ff}.pink{fill:#ff2d95}.purple{fill:#b66cff}
    .panel{fill:#0a0c18;fill-opacity:.94;stroke:#30304f;stroke-width:1.4}
    .tiny{font-size:11px;letter-spacing:50px}.label{font-size:13px;letter-spacing:50px}
    .pulse{animation:pulse 1 ease-in-out infinite;transform-origin:center}
    .dash{stroke-dasharray:10 120;animation:dash 90s linear infinite}
    .float{animation:float 1s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-220}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){.pulse,.dash,.float{animation:none}}
  </style>
</defs>
<rect width="1200" height="850" rx="24" fill="url(#bg)"/><rect width="1200" height="850" rx="24" fill="url(#grid)"/>
<path d="M24 76H1176" stroke="url(#rgb)" stroke-width="3"/><path d="M24 20H290L310 10H890L910 20H1176" fill="none" stroke="url(#rgb)" stroke-width="2"/>
<g>
  <text x="40" y="43" class="white" font-size="19" font-weight="900" letter-spacing="3">CLTX4 <tspan class="cyan">// CREATOR CONTROL CENTER</tspan></text>
  <text x="40" y="62" class="muted tiny">TIKTOK × GITHUB • NEON RGB ANALYTICS DASHBOARD</text>
  <g class="pulse"><circle cx="1126" cy="40" r="5" fill="#00f5ff"/><text x="1112" y="44" text-anchor="end" class="cyan tiny">STATUS: ONLINE DESIGN</text></g>
</g>
<!-- hero stats -->
<rect x="30" y="96" width="355" height="150" rx="17" class="panel"/>
<rect x="30" y="96" width="4" height="150" rx="2" fill="#ff2d95"/>
<text x="54" y="125" class="pink label" font-weight="700">TIKTOK / FOLLOWERS</text>
<text x="54" y="180" class="white" font-size="48" font-weight="900">2,600+</text>
<text x="54" y="207" class="muted" font-size="14">Current total • user-provided</text>
<text x="54" y="228" class="cyan tiny">THANK YOU FOR THE SUPPORT ♥</text>
<rect x="405" y="96" width="355" height="150" rx="17" class="panel"/>
<rect x="405" y="96" width="4" height="150" rx="2" fill="#00f5ff"/>
<text x="429" y="125" class="cyan label" font-weight="700">GITHUB / PROJECTS</text>
<text x="429" y="167" class="white" font-size="27" font-weight="900">CLTX4 PRODUCTION</text>
<text x="429" y="195" class="muted" font-size="14">Web tools • IoT • firmware projects</text>
<text x="429" y="224" class="purple tiny">REPOSITORY METRICS: NOT PROVIDED</text>
<rect x="780" y="96" width="390" height="150" rx="17" class="panel"/>
<rect x="780" y="96" width="4" height="150" rx="2" fill="#a855f7"/>
<text x="804" y="125" class="purple label" font-weight="700">NEXT COMMUNITY MILESTONE</text>
<text x="804" y="177" class="white" font-size="42" font-weight="900">3,000</text>
<text x="804" y="203" class="muted" font-size="14">Follower goal • 400 more to reach 3K*</text>
<rect x="804" y="218" width="332" height="7" rx="4" fill="#25253b"/><rect x="804" y="218" width="287" height="7" rx="4" fill="url(#rgb)"/>
<!-- line graph -->
<rect x="30" y="266" width="735" height="330" rx="17" class="panel"/>
<text x="54" y="299" class="white" font-size="19" font-weight="800">FOLLOWER TREND</text>
<text x="740" y="299" text-anchor="end" class="pink tiny">ILLUSTRATIVE DATA • NOT LIVE ANALYTICS</text>
<g stroke="#74749a" stroke-opacity=".23" stroke-width="1">
<path d="M88 345H729 M88 390H729 M88 435H729 M88 480H729 M88 525H729 M88 560H729"/>
<path d="M88 330V560 M216 330V560 M344 330V560 M472 330V560 M600 330V560 M729 330V560"/>
</g>
<g class="muted" font-size="11"><text x="78" y="349" text-anchor="end">2.6K</text><text x="78" y="394" text-anchor="end">2.3K</text><text x="78" y="439" text-anchor="end">2.0K</text><text x="78" y="484" text-anchor="end">1.7K</text><text x="78" y="529" text-anchor="end">1.4K</text><text x="88" y="580">START</text><text x="410" y="580" text-anchor="middle">TIME →</text><text x="729" y="580" text-anchor="end">CURRENT*</text></g>
<path d="M88 543 L141 527 L194 519 L247 497 L300 488 L353 469 L406 449 L459 438 L512 414 L565 396 L618 374 L671 354 L729 337 L729 560H88Z" fill="url(#pinkArea)"/>
<path d="M88 543 L141 527 L194 519 L247 497 L300 488 L353 469 L406 449 L459 438 L512 414 L565 396 L618 374 L671 354 L729 337" fill="none" stroke="#ff2d95" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M88 543 L141 527 L194 519 L247 497 L300 488 L353 469 L406 449 L459 438 L512 414 L565 396 L618 374 L671 354 L729 337" fill="none" stroke="#00f5ff" stroke-opacity=".65" stroke-width="1.3" class="dash"/>
<circle cx="729" cy="337" r="7" fill="#fff" stroke="#ff2d95" stroke-width="4" class="pulse"/>
<!-- pie chart -->
<rect x="785" y="266" width="385" height="330" rx="17" class="panel"/>
<text x="809" y="299" class="white" font-size="19" font-weight="800">CONTENT / PROJECT MIX</text>
<text x="1145" y="321" text-anchor="end" class="purple tiny">EXAMPLE ONLY</text>
<circle cx="927" cy="430" r="76" fill="none" stroke="#28283d" stroke-width="31"/>
<circle cx="927" cy="430" r="76" fill="none" stroke="#00f5ff" stroke-width="31" stroke-dasharray="191 477" transform="rotate(-90 927 430)" class="pulse"/>
<circle cx="927" cy="430" r="76" fill="none" stroke="#a855f7" stroke-width="31" stroke-dasharray="143 477" stroke-dashoffset="-191" transform="rotate(-90 927 430)"/>
<circle cx="927" cy="430" r="76" fill="none" stroke="#ff2d95" stroke-width="31" stroke-dasharray="143 477" stroke-dashoffset="-334" transform="rotate(-90 927 430)"/>
<text x="927" y="426" text-anchor="middle" class="white" font-size="22" font-weight="900">MIX</text><text x="927" y="446" text-anchor="middle" class="muted" font-size="11">SAMPLE</text>
<g font-size="13" class="white">
<circle cx="1033" cy="373" r="5" fill="#00f5ff"/><text x="1047" y="378">IoT / electronics</text><text x="1145" y="378" text-anchor="end" class="cyan">40%</text>
<circle cx="1033" cy="411" r="5" fill="#a855f7"/><text x="1047" y="416">Web / coding</text><text x="1145" y="416" text-anchor="end" class="purple">30%</text>
<circle cx="1033" cy="449" r="5" fill="#ff2d95"/><text x="1047" y="454">Creator content</text><text x="1145" y="454" text-anchor="end" class="pink">30%</text>
</g>
<text x="809" y="540" class="muted" font-size="12">Replace these example percentages with</text><text x="809" y="558" class="muted" font-size="12">your real content analytics when available.</text>
<!-- lower cards -->
<rect x="30" y="616" width="270" height="126" rx="16" class="panel"/>
<text x="52" y="646" class="cyan tiny" font-weight="700">TIKTOK COMMUNITY</text><text x="52" y="684" class="white" font-size="29" font-weight="900">2.6K+</text><text x="52" y="711" class="muted" font-size="13">Followers reported by creator</text>
<rect x="315" y="616" width="270" height="126" rx="16" class="panel"/>
<text x="337" y="646" class="purple tiny" font-weight="700">GITHUB REPOSITORIES</text><text x="337" y="681" class="white" font-size="23" font-weight="900">ADD YOUR STATS</text><text x="337" y="711" class="muted" font-size="13">Stars • forks • contributions</text>
<rect x="600" y="616" width="270" height="126" rx="16" class="panel"/>
<text x="622" y="646" class="pink tiny" font-weight="700">GROWTH TARGET</text><text x="622" y="684" class="white" font-size="29" font-weight="900">3,000</text><text x="622" y="711" class="muted" font-size="13">Milestone goal, not a prediction</text>
<rect x="885" y="616" width="285" height="126" rx="16" class="panel"/>
<text x="907" y="646" class="cyan tiny" font-weight="700">CLTX4 MOTTO</text><text x="907" y="680" class="white" font-size="21" font-weight="900">BUILD. CODE. CREATE.</text><text x="907" y="711" class="muted" font-size="13">CREATE // SHARE // INSPIRE</text>
<path d="M30 771H1170" stroke="url(#rgb)" stroke-width="2"/>
<text x="35" y="801" class="white" font-size="15" font-weight="800">CLTX4 PRODUCTION</text><text x="35" y="822" class="muted" font-size="11">Neon RGB • GitHub README SVG • Responsive vector artwork</text>
<text x="1165" y="802" text-anchor="end" class="cyan" font-size="13" font-weight="700">THANK YOU FOR 2,600+ ♥</text>
<text x="1165" y="822" text-anchor="end" class="muted" font-size="11">*400 more to reach 3,000, based on 2,600 as the starting count.</text>
</svg>
